<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 224" width="480" height="224" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" role="img" aria-label="LLM Inference Engine from Scratch"><rect x="1" y="1" width="478" height="222" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="24" y="24" width="44" height="44" rx="10" fill="#56d364" fill-opacity="0.15"/><g transform="translate(35 35) scale(0.92)" fill="none" stroke="#56d364" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></g><text x="82" y="53" font-size="20" font-weight="600" fill="#f0f6fc">LLM Inference Engine from Scratch</text><text x="24" y="100" font-size="16" font-weight="400" fill="#c9d1d9">A server that runs an LLM for many users at once, built</text><text x="24" y="123" font-size="16" font-weight="400" fill="#c9d1d9">in plain PyTorch with the scheduling and memory</text><text x="24" y="146" font-size="16" font-weight="400" fill="#c9d1d9">techniques that production engines use.</text><rect x="24" y="174" width="72" height="26" rx="6" fill="#21262d"/><text x="60.0" y="192" font-size="13" fill="#c9d1d9" text-anchor="middle">PyTorch</text><rect x="104" y="174" width="50" height="26" rx="6" fill="#21262d"/><text x="129.0" y="192" font-size="13" fill="#c9d1d9" text-anchor="middle">CUDA</text><rect x="162" y="174" width="72" height="26" rx="6" fill="#21262d"/><text x="198.0" y="192" font-size="13" fill="#c9d1d9" text-anchor="middle">FastAPI</text></svg>