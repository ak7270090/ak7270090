<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 224" width="480" height="224" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" role="img" aria-label="AI On-Call Agent"><rect x="1" y="1" width="478" height="222" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><rect x="24" y="24" width="44" height="44" rx="10" fill="#cf222e" fill-opacity="0.15"/><g transform="translate(35 35) scale(0.92)" fill="none" stroke="#cf222e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></g><text x="82" y="53" font-size="20" font-weight="600" fill="#1f2328">AI On-Call Agent</text><text x="24" y="100" font-size="16" font-weight="400" fill="#424a53">Ask in plain English when something breaks. It checks</text><text x="24" y="123" font-size="16" font-weight="400" fill="#424a53">pods, logs, metrics and recent deployments, finds the</text><text x="24" y="146" font-size="16" font-weight="400" fill="#424a53">real cause, and writes a short report.</text><rect x="24" y="174" width="43" height="26" rx="6" fill="#e7ebf0"/><text x="45.5" y="192" font-size="13" fill="#424a53" text-anchor="middle">MCP</text><rect x="75" y="174" width="86" height="26" rx="6" fill="#e7ebf0"/><text x="118.0" y="192" font-size="13" fill="#424a53" text-anchor="middle">LangGraph</text><rect x="169" y="174" width="93" height="26" rx="6" fill="#e7ebf0"/><text x="215.5" y="192" font-size="13" fill="#424a53" text-anchor="middle">Kubernetes</text><rect x="270" y="174" width="93" height="26" rx="6" fill="#e7ebf0"/><text x="316.5" y="192" font-size="13" fill="#424a53" text-anchor="middle">Prometheus</text><rect x="371" y="174" width="79" height="26" rx="6" fill="#e7ebf0"/><text x="410.5" y="192" font-size="13" fill="#424a53" text-anchor="middle">Langfuse</text></svg>