<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 224" width="480" height="224" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" role="img" aria-label="Deep Learning from Scratch"><rect x="1" y="1" width="478" height="222" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="24" y="24" width="44" height="44" rx="10" fill="#a5b4fc" fill-opacity="0.15"/><g transform="translate(35 35) scale(0.92)" fill="none" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></g><text x="82" y="53" font-size="20" font-weight="600" fill="#f0f6fc">Deep Learning from Scratch</text><text x="24" y="100" font-size="16" font-weight="400" fill="#c9d1d9">The core neural networks built step by step, from a</text><text x="24" y="123" font-size="16" font-weight="400" fill="#c9d1d9">single perceptron to an LSTM that predicts the next</text><text x="24" y="146" font-size="16" font-weight="400" fill="#c9d1d9">word.</text><rect x="24" y="174" width="93" height="26" rx="6" fill="#21262d"/><text x="70.5" y="192" font-size="13" fill="#c9d1d9" text-anchor="middle">TensorFlow</text><rect x="125" y="174" width="58" height="26" rx="6" fill="#21262d"/><text x="154.0" y="192" font-size="13" fill="#c9d1d9" text-anchor="middle">Keras</text><rect x="191" y="174" width="72" height="26" rx="6" fill="#21262d"/><text x="227.0" y="192" font-size="13" fill="#c9d1d9" text-anchor="middle">Jupyter</text></svg>