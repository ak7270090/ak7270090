<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 224" width="480" height="224" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" role="img" aria-label="Real-Time Video Meet"><rect x="1" y="1" width="478" height="222" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><rect x="24" y="24" width="44" height="44" rx="10" fill="#0f7b85" fill-opacity="0.15"/><g transform="translate(35 35) scale(0.92)" fill="none" stroke="#0f7b85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></g><text x="82" y="53" font-size="20" font-weight="600" fill="#1f2328">Real-Time Video Meet</text><text x="24" y="100" font-size="16" font-weight="400" fill="#424a53">A video meeting app that transcribes live speech, spots</text><text x="24" y="123" font-size="16" font-weight="400" fill="#424a53">grammar mistakes, and writes a meeting summary. Won 3rd</text><text x="24" y="146" font-size="16" font-weight="400" fill="#424a53">place at LNMHacks.</text><rect x="24" y="174" width="58" height="26" rx="6" fill="#e7ebf0"/><text x="53.0" y="192" font-size="13" fill="#424a53" text-anchor="middle">React</text><rect x="90" y="174" width="72" height="26" rx="6" fill="#e7ebf0"/><text x="126.0" y="192" font-size="13" fill="#424a53" text-anchor="middle">Node.js</text><rect x="170" y="174" width="72" height="26" rx="6" fill="#e7ebf0"/><text x="206.0" y="192" font-size="13" fill="#424a53" text-anchor="middle">MongoDB</text><rect x="250" y="174" width="65" height="26" rx="6" fill="#e7ebf0"/><text x="282.5" y="192" font-size="13" fill="#424a53" text-anchor="middle">WebRTC</text></svg>