<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 224" width="480" height="224" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" role="img" aria-label="Journey Engine"><rect x="1" y="1" width="478" height="222" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="24" y="24" width="44" height="44" rx="10" fill="#e3b341" fill-opacity="0.15"/><g transform="translate(35 35) scale(0.92)" fill="none" stroke="#e3b341" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></g><text x="82" y="53" font-size="20" font-weight="600" fill="#f0f6fc">Journey Engine</text><text x="24" y="100" font-size="16" font-weight="400" fill="#c9d1d9">Watches what each shopper does on a site and sends the</text><text x="24" y="123" font-size="16" font-weight="400" fill="#c9d1d9">right message at the right moment. Marketing teams build</text><text x="24" y="146" font-size="16" font-weight="400" fill="#c9d1d9">these journeys by drag and drop.</text><rect x="24" y="174" width="79" height="26" rx="6" fill="#21262d"/><text x="63.5" y="192" font-size="13" fill="#c9d1d9" text-anchor="middle">Temporal</text><rect x="111" y="174" width="79" height="26" rx="6" fill="#21262d"/><text x="150.5" y="192" font-size="13" fill="#c9d1d9" text-anchor="middle">RabbitMQ</text><rect x="198" y="174" width="72" height="26" rx="6" fill="#21262d"/><text x="234.0" y="192" font-size="13" fill="#c9d1d9" text-anchor="middle">FastAPI</text><rect x="278" y="174" width="72" height="26" rx="6" fill="#21262d"/><text x="314.0" y="192" font-size="13" fill="#c9d1d9" text-anchor="middle">Next.js</text><rect x="358" y="174" width="93" height="26" rx="6" fill="#21262d"/><text x="404.5" y="192" font-size="13" fill="#c9d1d9" text-anchor="middle">PostgreSQL</text></svg>