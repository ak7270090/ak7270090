<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 224" width="480" height="224" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" role="img" aria-label="Voice AI Orchestration"><rect x="1" y="1" width="478" height="222" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><rect x="24" y="24" width="44" height="44" rx="10" fill="#bf3989" fill-opacity="0.15"/><g transform="translate(35 35) scale(0.92)" fill="none" stroke="#bf3989" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v4M8 23h8"/></g><text x="82" y="53" font-size="20" font-weight="600" fill="#1f2328">Voice AI Orchestration</text><text x="24" y="100" font-size="16" font-weight="400" fill="#424a53">Upload documents and talk to them out loud. It finds the</text><text x="24" y="123" font-size="16" font-weight="400" fill="#424a53">answer in your files, replies by voice, and shows the</text><text x="24" y="146" font-size="16" font-weight="400" fill="#424a53">sources.</text><rect x="24" y="174" width="72" height="26" rx="6" fill="#e7ebf0"/><text x="60.0" y="192" font-size="13" fill="#424a53" text-anchor="middle">FastAPI</text><rect x="104" y="174" width="72" height="26" rx="6" fill="#e7ebf0"/><text x="140.0" y="192" font-size="13" fill="#424a53" text-anchor="middle">LiveKit</text><rect x="184" y="174" width="79" height="26" rx="6" fill="#e7ebf0"/><text x="223.5" y="192" font-size="13" fill="#424a53" text-anchor="middle">ChromaDB</text><rect x="271" y="174" width="65" height="26" rx="6" fill="#e7ebf0"/><text x="303.5" y="192" font-size="13" fill="#424a53" text-anchor="middle">OpenAI</text></svg>